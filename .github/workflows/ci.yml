name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  OSS_CAD_VERSION: "2026-09-08"
  OSS_CAD_STAMP: "20260908"
  # El mapa de registros se genera desde avr-libc. Distintas versiones de
  # avr-libc pueden diferir, así que la CI usa EXACTAMENTE el mismo toolchain
  # que env.sh en local; si no, `make regmap-check` fallaría sin que el mapa
  # esté mal.
  AVR_GCC_URL: "https://downloads.arduino.cc/tools/avr-gcc-7.3.0-atmel3.6.1-arduino7-x86_64-pc-linux-gnu.tar.bz2"

jobs:
  lint-and-generate:
    name: Lint y ficheros generados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cachear OSS CAD Suite
        id: cache-oss
        uses: actions/cache@v4
        with:
          path: ~/eda/oss-cad-suite
          key: oss-cad-${{ env.OSS_CAD_VERSION }}

      - name: Instalar OSS CAD Suite
        if: steps.cache-oss.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/eda && cd ~/eda
          curl -sL -o oss.tgz \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_STAMP}.tgz"
          tar xzf oss.tgz && rm oss.tgz

      - name: Cachear toolchain AVR
        id: cache-avr
        uses: actions/cache@v4
        with:
          path: ~/eda/avr
          key: avr-gcc-7.3.0-atmel3.6.1-arduino7

      - name: Instalar toolchain AVR (misma versión que en local)
        if: steps.cache-avr.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/eda/avr && cd ~/eda/avr
          curl -sL -o avr-gcc.tar.bz2 "$AVR_GCC_URL"
          tar xjf avr-gcc.tar.bz2 && rm avr-gcc.tar.bz2
          mv avr avr-gcc-7.3.0

      - name: Añadir avr-gcc al PATH
        run: echo "$HOME/eda/avr/avr-gcc-7.3.0/bin" >> $GITHUB_PATH

      - name: Mapa de registros al día
        run: make regmap-check

      - name: Constraints de la ULX3S reproducibles
        run: |
          make lpf
          git diff --exit-code rtl/fpga/ecp5/axioma_ulx3s.lpf

      - name: Lint del RTL
        run: |
          source ~/eda/oss-cad-suite/environment
          make lint

      - name: Enlaces de la documentación
        run: |
          python3 - <<'PY'
          import re, os, sys
          bad = []
          for dp, dn, fn in os.walk('.'):
              if '.git' in dp: continue
              for f in fn:
                  if not f.endswith('.md'): continue
                  p = os.path.join(dp, f)
                  for m in re.finditer(r'\]\((?!https?:)([^)\s#]+)', open(p, encoding='utf-8').read()):
                      if not os.path.exists(os.path.normpath(os.path.join(dp, m.group(1)))):
                          bad.append(f"{p} -> {m.group(1)}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("todos los enlaces resuelven")
          PY

  verify:
    name: Verificación del núcleo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cachear OSS CAD Suite
        id: cache-oss
        uses: actions/cache@v4
        with:
          path: ~/eda/oss-cad-suite
          key: oss-cad-${{ env.OSS_CAD_VERSION }}

      - name: Instalar OSS CAD Suite
        if: steps.cache-oss.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/eda && cd ~/eda
          curl -sL -o oss.tgz \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/${OSS_CAD_VERSION}/oss-cad-suite-linux-x64-${OSS_CAD_STAMP}.tgz"
          tar xzf oss.tgz && rm oss.tgz

      - name: Cachear toolchain AVR
        id: cache-avr
        uses: actions/cache@v4
        with:
          path: ~/eda/avr
          key: avr-gcc-7.3.0-atmel3.6.1-arduino7

      # Hace falta en este job, no sólo en el de lint: avr-objdump es el oráculo
      # del decodificador y de la tabla de ciclos, y avr-gcc ensambla los
      # programas de la co-simulación diferencial.
      - name: Instalar toolchain AVR (misma versión que en local)
        if: steps.cache-avr.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/eda/avr && cd ~/eda/avr
          curl -sL -o avr-gcc.tar.bz2 "$AVR_GCC_URL"
          tar xjf avr-gcc.tar.bz2 && rm avr-gcc.tar.bz2
          mv avr avr-gcc-7.3.0

      - name: Añadir avr-gcc al PATH
        run: echo "$HOME/eda/avr/avr-gcc-7.3.0/bin" >> $GITHUB_PATH

      - name: Entorno Python
        run: |
          python3 -m venv ~/eda/venv
          ~/eda/venv/bin/pip install -q numpy pytest pyelftools intelhex

      - name: Los dos modelos de referencia de la ALU coinciden
        run: ~/eda/venv/bin/python sim/alu/alu_ref.py --self-test

      - name: ALU - barrido exhaustivo del espacio de entrada
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-alu

      - name: SREG - prueba dirigida
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-sreg

      - name: Banco de registros - 200k ciclos contra modelo sombra
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-regfile

      - name: Memorias de programa y datos
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-mem

      - name: Bus de datos - las 65 536 direcciones
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-dbus

      - name: Puertos de E/S - sincronizador y toggle por PINx
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-gpio

      # El temporizador y su prescaler van en el mismo banco porque la trampa
      # numero 12 —el prescaler es libre y compartido, y arrancar el
      # temporizador no lo pone a cero— solo se puede comprobar con los dos
      # juntos. El modelo de referencia sale de la hoja de datos, no de simavr,
      # que aqui se aparta de ella en cinco puntos.
      - name: Timer0 y prescaler compartido contra la hoja de datos
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-timer0

      # El unico periferico con efecto lateral de LECTURA, y aquel para el que
      # simavr sirve de menos: su modelo NO SERIALIZA nada, asi que la forma de
      # onda la certifica un receptor escrito desde la hoja de datos que
      # decodifica el pin y mide el periodo de bit.
      - name: USART0 contra un receptor de verdad
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-usart

      # Exhaustivo de verdad: las 67 108 864 combinaciones de las 26
      # peticiones. El espacio de entrada es enumerable, asi que se barre
      # entero en vez de muestrear.
      - name: Controlador de interrupciones, exhaustivo
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-irq

      # Cada periferico tiene su banco, pero que esten bien COLOCADOS es otra
      # propiedad. Barre las 224 direcciones del espacio de I/O por el bus real
      # y comprueba que no hay colisiones y que el mapa es el de la hoja de
      # datos. Ahi habia aparecido ya un fallo: un bit de mas en el mapa de
      # vectores convertia TIMER0_COMPA en TIMER1_OVF.
      - name: Mapa de I/O del SoC, barrido entero
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-soc

      - name: Cachear simavr
        id: cache-simavr
        uses: actions/cache@v4
        with:
          path: ~/eda/simavr-src
          key: simavr-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Compilar simavr
        if: steps.cache-simavr.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libelf-dev
          git clone -q --depth 1 https://github.com/buserror/simavr.git ~/eda/simavr-src
          make -C ~/eda/simavr-src -j$(nproc) build-simavr

      - name: Contraste contra simavr (tercer oráculo, independiente)
        run: sudo apt-get install -y -qq libelf-dev && make sim-simavr

      - name: Decodificador contra avr-objdump (65 536 opcodes)
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-decode

      # Incluye la capa 3: contrasta los ciclos de cada instrucción retirada
      # contra la tabla del manual, y reporta la cobertura alcanzada.
      - name: Co-simulación diferencial contra simavr, con tabla de ciclos
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-diff

      # Último requisito del criterio de aceptación de la fase 1. Tarda unos
      # 2 segundos: los programas se generan con semilla fija, así que un fallo
      # en CI se reproduce localmente con el mismo comando.
      - name: Regresión aleatoria de 10^6 instrucciones
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-random

      # Un programa en C compilado con avr-gcc y avr-libc SIN MODIFICAR,
      # contrastado contra simavr. Ejercita de una vez el arranque que genera
      # el compilador, la tabla de vectores, la entrada y salida de ISR, el
      # Timer0 y el puerto de E/S. Es medio criterio de compatibilidad L2.
      - name: Firmware en C contra simavr
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-fw

      # EL CRITERIO DE ACEPTACION DE LA FASE 2, menos el cable: un programa en
      # C sin modificar corre sobre el SoC completo y el banco lee el PIN como
      # lo leeria un conversor USB-serie. No mira ningun registro para sacar
      # los caracteres: decodifica la forma de onda.
      - name: Blink y Serial leidos del pin
        run: |
          source ~/eda/oss-cad-suite/environment
          make sim-hello

      # QUE EL RTL SIGA SINTETIZANDO NO LO COMPROBABA NADIE. El lint de
      # verilator no es un sintetizador: no infiere latches ni dice cuanta area
      # ocupa cada modulo, y el README citaba numeros de LUT que nadie volvia a
      # medir. Este paso pasa yosys por todo el RTL, falla si aparece un latch
      # y publica el area.
      - name: Sintesis - sin latches y con area medida
        run: |
          source ~/eda/oss-cad-suite/environment
          make synth-check
