# AxiomaCore-328 - definición de la pieza para avrdude
# SPDX-License-Identifier: Apache-2.0
#
# ESTE FICHERO ES EL CAMINO B, Y CONVIENE DECIR POR QUÉ HAY DOS.
#
# El gestor de arranque de `fw/bootloader/` contesta la firma del ATmega328P
# —0x1E 0x95 0x0F—, y con eso `avrdude -p m328p -c arduino` y el IDE de Arduino
# funcionan **sin instalar nada**. Ése es el camino A, y es el que cumple el
# criterio de aceptación de la fase 4: «sin herramientas externas».
#
# El camino B es éste: compilar el gestor con `-DFIRMA_PROPIA`, que contesta
# **0x1E 0xA0 0x01**, y decirle a avrdude qué es esa pieza con este fichero. Es
# más honesto —el chip no se hace pasar por otro— y es lo que haría falta si
# algún día la firma tuviera que ser distinguible, por ejemplo para que una
# herramienta sepa que puede usar algo que el 328P no tiene.
#
# Los dos caminos son válidos y se dejan los dos elegidos a propósito, porque
# la decisión no es técnica sino de cómo se quiere presentar el chip.
#
# ---------------------------------------------------------------------------
# CÓMO SE USA
# ---------------------------------------------------------------------------
#
#   avrdude -C +sw/avrdude/axioma.conf -p axioma328 -c arduino \
#           -P /dev/ttyUSB0 -b 19200 -U flash:w:sketch.hex:i
#
# El `+` delante del fichero es importante: le dice a avrdude que **añada**
# esto a su configuración del sistema en vez de sustituirla. Sin el `+`, se
# pierden todas las demás piezas y programadores, incluido el `arduino` que
# este fichero necesita.
#
# ---------------------------------------------------------------------------
# LO QUE HEREDA Y LO QUE NO
# ---------------------------------------------------------------------------
#
# Hereda del `m328p`, que ya trae los tamaños y tiempos correctos: 32 KB de
# Flash en páginas de 128 bytes, 1 KB de EEPROM en páginas de 4, y los 2 KB de
# SRAM. No se repiten aquí porque repetirlos es garantizar que un día se
# desincronicen — y porque son los mismos: este chip **es** un 328P por dentro.
#
# Lo único que cambia es la firma.

part parent "m328p"
    id               = "axioma328";
    desc             = "AxiomaCore-328";

    # 0x1E  el fabricante. Se deja el de Atmel a propósito: el primer byte de
    #       la firma identifica a quien fabrica el silicio, y mientras esto
    #       corra en una FPGA o en un PDK abierto no hay un código asignado que
    #       poner ahí. Inventarse uno sería peor que reutilizar éste.
    # 0xA0  el tamaño, en el hueco que el 328P no usa (el suyo es 0x95).
    # 0x01  la revisión de este núcleo.
    signature        = 0x1e 0xa0 0x01;
;
